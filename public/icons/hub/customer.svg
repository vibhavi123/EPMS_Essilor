  <rect x="15" y="45" width="4" height="3.5" rx="0.8" fill="#A5F3FC"/>
  <!-- Building Entrance -->
  <rect x="32" y="45" width="8" height="11" rx="2" fill="#155E75"/>
  <rect x="33.5" y="47" width="5" height="9" rx="1" fill="#E0F2FE"/>
  <!-- User Badge Accent in Foreground -->
  <circle cx="48" cy="46" r="10" fill="#0284C7" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="48" cy="43.5" r="3.5" fill="#FFFFFF"/>
